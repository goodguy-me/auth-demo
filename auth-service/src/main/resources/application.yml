server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auth_db?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23liC0DkHGgOJOzobl}
            client-secret: ${GITHUB_CLIENT_SECRET:http://localhost:7573/auth/github/callback}
            scope: user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitHub
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id
github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:Ov23liC0DkHGgOJOzobl}
    client-secret: ${GITHUB_CLIENT_SECRET:7ee538945c3703e85fc477c66fca9a38f5cde630}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:7573/auth/github/callback}
ldap:
  urls: ${LDAP_URLS:ldap://localhost:389}
  base: ${LDAP_BASE:dc=example,dc=com}
  user-dn: ${LDAP_USER_DN:cn=admin,dc=example,dc=com}
  password: ${LDAP_PASSWORD:adminpassword}
  # 用户搜索过滤条件，{0} 会被替换为用户名
  user-search-filter: (uid={0})
  # 组搜索基础 DN 及过滤条件
  group-search-base: ou=groups
  group-search-filter: (member={0})
  # 角色映射：LDAP组DN -> 系统角色
  role-mapping:
    "cn=admins,ou=groups,dc=example,dc=com": PRODUCT_ADMIN
    "cn=editors,ou=groups,dc=example,dc=com": EDITOR
    "cn=users,ou=groups,dc=example,dc=com": USER
