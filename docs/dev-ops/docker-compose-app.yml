#   ---------- 认证服务 ----------
  auth-service:
    image: zszadmin/auth-service-app:1.0.0
    container_name: auth-service
    depends_on:
      mysql:
        condition: service_healthy
      ldap-service:
        condition: service_started
    environment:
      # 数据库配置
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?serverTimezone=UTC&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      # LDAP 配置
      LDAP_URLS: ldap://ldap-service:389
      LDAP_BASE: ${LDAP_BASE:-dc=example,dc=com}
      LDAP_USER_DN: ${LDAP_USER_DN:-cn=admin,dc=example,dc=com}
      LDAP_PASSWORD: ${LDAP_ADMIN_PASSWORD}   # 与 LDAP 管理员密码一致
      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET:-mySuperSecretKeyForJwtTokenGeneration2024}
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:7573/auth/github/callback}
      NACOS_SERVER: nacos:8848
    restart: always
    networks:
      - auth-network

  product-service:
    image: zszadmin/product-service:1.0.0
    container_name: product-service
    depends_on:
      - auth-service
    environment:
      # 数据库配置
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?serverTimezone=UTC&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      NACOS_SERVER: nacos:8848

    restart: always
    networks:
      - auth-network

  # ---------- 网关服务 ----------
  gateway:
    image: zszadmin/gateway-app:1.0.0
    container_name: gateway
    ports:
      - "7573:7573"
    depends_on:
      - auth-service
    environment:
      NACOS_SERVER: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-mySuperSecretKeyForJwtTokenGeneration2024}
    restart: always
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge