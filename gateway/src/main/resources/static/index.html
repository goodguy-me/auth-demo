<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>统一登录 - 普通 / GitHub / LDAP</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        form { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        hr { margin: 30px 0; }
        .github-btn { background: #24292e; }
        .github-btn:hover { background: #0b0e11; }
        .ldap-btn { background: #28a745; }
        .ldap-btn:hover { background: #1e7e34; }
    </style>
</head>
<body>
<h1>🔐 Uaa 用户认证</h1>

<!-- 普通登录 -->
<form id="loginForm">
    <h3>普通登录</h3>
    <input type="text" id="username" placeholder="用户名" required>
    <input type="password" id="password" placeholder="密码" required>
    <button type="submit">登录</button>
</form>

<!-- GitHub 登录（统一入口） -->
<button id="githubLoginBtn" class="github-btn">使用 GitHub 登录</button>
<a href="/oauth2/authorization/github">
    <button>使用 GitHub 登录</button>
</a>
<hr>

<!-- LDAP 登录 -->
<form id="ldapLoginForm">
    <h3>LDAP 登录</h3>
    <input type="text" id="ldapUsername" placeholder="LDAP 用户名" required>
    <input type="password" id="ldapPassword" placeholder="密码" required>
    <button type="submit" class="ldap-btn">使用 LDAP 登录</button>
</form>

<script>
    // ---------- 工具函数：统一处理响应 ----------
    async function unifiedLogin(loginType, username, password) {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                type: loginType,
                username: username,
                password: password
            })
        });

        const result = await response.json();   // 完整响应体
        if (!response.ok) {
            // HTTP 错误（4xx/5xx）统一处理
            throw new Error(result.info || '请求失败');
        }

        // 业务状态码判断（成功码假设为 '0000'，请根据实际情况调整）
        if (result.code !== '0000') {
            // 优先使用 data.errorMessage，其次 info
            const errorMsg = result.data?.errorMessage || result.info || '登录失败';
            throw new Error(errorMsg);
        }

        return result.data; // 成功时返回 data 对象
    }

    // ---------- 普通登录 ----------
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const data = await unifiedLogin('form', username, password);
            localStorage.setItem('token', data.accessToken);
            alert('✅ 普通登录成功！');
            window.location.href = '/dashboard';
        } catch (error) {
            alert('❌ 普通登录失败：' + error.message);
        }
    });

    // ---------- LDAP 登录 ----------
    document.getElementById('ldapLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('ldapUsername').value.trim();
        const password = document.getElementById('ldapPassword').value;

        try {
            const data = await unifiedLogin('ldap', username, password);
            localStorage.setItem('token', data.accessToken);
            alert('✅ LDAP 登录成功！');
            window.location.href = '/dashboard';
        } catch (error) {
            alert('❌ LDAP 登录失败：' + error.message);
        }
    });

    // ---------- GitHub 登录（第一步：获取重定向地址）----------
    document.getElementById('githubLoginBtn').addEventListener('click', async () => {
        try {
            const data = await unifiedLogin('github'); // 无需账号密码
            // data.redirectUrl 存在即跳转
            if (data.redirectUrl) {
                window.location.href = data.redirectUrl;
            } else {
                throw new Error('未返回重定向地址');
            }
        } catch (error) {
            alert('❌ GitHub 登录失败：' + error.message);
        }
    });

    // ---------- GitHub OAuth2 回调处理（后端重定向到当前页，URL 带 token）----------
    (function handleGithubCallback() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            localStorage.setItem('token', token);
            window.history.replaceState({}, document.title, window.location.pathname);
            alert('✅ GitHub 登录成功！');
            window.location.href = '/dashboard';
        }
    })();
</script>
</body>
</html>
