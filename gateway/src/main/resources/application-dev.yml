server:
  port: 7573

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: product
              uri: lb://product-service
              predicates:
                - Path=/products/**
logging:
  level:
    org.example.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG